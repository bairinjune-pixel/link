<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>{{ file_name }}</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

<style>
:root{ --accent:#e50914; }

html,body{
  margin:0;
  padding:0;
  background:#000;
  font-family:'Montserrat',sans-serif;
  color:white;
  overflow-x:hidden;
  transition:background .6s ease, color .6s ease;
}

/* ================= INTRO ================= */

#intro{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
  text-align:center;
}

.intro-text{
  font-family:'Orbitron',sans-serif;
  font-weight:900;
  font-size:clamp(26px,9vw,110px);
  letter-spacing:clamp(3px,1.8vw,12px);
  text-transform:uppercase;
  opacity:0;
  transform:scale(.9);
  animation:titleReveal 3s cubic-bezier(.77,0,.18,1) forwards;
  position:relative;
}

.intro-text::after{
  content:"";
  position:absolute;
  left:50%;
  bottom:-14px;
  height:3px;
  width:70%;
  background:linear-gradient(90deg,transparent,#e50914,transparent);
  transform:translateX(-50%) scaleX(0);
  transform-origin:center;
  animation:lineExpand 1.8s ease forwards .8s;
}

@keyframes titleReveal{
  0%{opacity:0;transform:scale(.9) translateY(20px);filter:blur(6px);}
  40%{opacity:1;transform:scale(1) translateY(0);filter:blur(0);}
  100%{text-shadow:0 0 40px rgba(229,9,20,.8),0 0 80px rgba(229,9,20,.4);}
}
@keyframes lineExpand{ to{transform:translateX(-50%) scaleX(1);} }
.fade-out{ animation:fadeOut 1s ease forwards; }
@keyframes fadeOut{ to{opacity:0;visibility:hidden;} }

/* ================= NAVBAR ================= */

.navbar{
  position:fixed;
  top:0; left:0; right:0;
  height:70px;
  display:flex;
  align-items:center;
  padding:0 40px;
  background:linear-gradient(to bottom, rgba(0,0,0,.95), transparent);
  z-index:50;
}

.nav-left{
  font-family:'Orbitron',sans-serif;
  font-weight:800;
  letter-spacing:3px;
  position:relative;
  cursor:pointer;
  transition:color .3s ease, text-shadow .3s ease;
}

.nav-left::after{
  content:"";
  position:absolute;
  left:50%;
  bottom:-6px;
  width:0%;
  height:2px;
  background:var(--accent);
  transform:translateX(-50%);
  transition:width .35s ease;
}

.nav-left:hover{
  color:var(--accent);
  text-shadow:0 0 10px rgba(229,9,20,.6);
}

.nav-left:hover::after{
  width:100%;
}

/* ================= BUTTON HOVER ================= */

button{
  background:rgba(255,255,255,.1);
  color:white;
  border:none;
  padding:10px 16px;
  border-radius:8px;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  transition:all .3s ease;
}

button::after{
  content:"";
  position:absolute;
  left:50%;
  bottom:0;
  width:0%;
  height:2px;
  background:var(--accent);
  transform:translateX(-50%);
  transition:.3s ease;
}

button:hover{
  background:rgba(229,9,20,.25);
  box-shadow:0 0 15px rgba(229,9,20,.5);
  transform:translateY(-2px);
}

button:hover::after{
  width:80%;
}

/* ================= CANVAS BACKGROUND ================= */

#bg{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
}

/* ================= MAIN ================= */

.main-wrapper{
  position:relative;
  z-index:10;
  padding-top:100px;
  padding-bottom:80px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* ================= PLAYER ================= */

#player{
  width:88vw;
  max-width:1200px;
  background:rgba(255,255,255,.05);
  backdrop-filter:blur(40px) saturate(180%);
  border-radius:28px;
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 80px 180px rgba(0,0,0,.6);
  overflow:hidden;
  position:relative;
}

#player.mini{
  width:320px;
  position:fixed;
  bottom:20px;
  right:20px;
  z-index:100;
  cursor:grab;
}

.header{
  height:55px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  background:rgba(0,0,0,.5);
}

.viewport{ aspect-ratio:16/9; background:#000; }
video{ width:100%; height:100%; object-fit:contain; }

/* ================= FILE INFO ================= */

.section-box{
  width:88vw;
  max-width:1200px;
  margin-top:30px;
  padding:25px;
  border-radius:20px;
  background:rgba(255,255,255,.05);
  backdrop-filter:blur(20px);
  text-align:center;
  word-wrap:break-word;
}

.file-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:15px;
}

/* ================= LIGHT MODE ================= */

body.light-mode{
  background:#f4f4f4;
  color:#111;
}

body.light-mode #player,
body.light-mode .section-box{
  background:rgba(255,255,255,.85);
}

body.light-mode button{
  background:rgba(0,0,0,.05);
  color:#000;
}

/* ================= THEME BUTTON ================= */

.theme-toggle{
  position:fixed;
  top:18px;
  right:18px;
  z-index:60;
  font-size:18px;
  width:32px;
  height:32px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:none;
  cursor:pointer;
  color:#ffffff !important;
}
</style>
</head>
<body>

<div id="intro">
  <div class="intro-text">STREAM</div>
</div>

<div class="navbar">
  <div class="nav-left">{{ file_name }}</div>
</div>

<canvas id="bg"></canvas>

<div class="theme-toggle" id="themeIcon">✧</div>

<div class="main-wrapper">

  <div id="player">
    <div class="header">
      <span>PLAYING</span>
      <div>
        <button onclick="toggleMini()">Mɪɴɪ</button>
        <button onclick="goFullscreen()">Fᴜʟʟ</button>
      </div>
    </div>
  </div>

  <div class="section-box">
    <h3>{{ file_name }}</h3>
    <p>Size: {{ file_size }}</p>
    <div class="file-buttons">
      <button onclick="copyLink()">Cᴏᴘʏ ʟɪɴᴋ</button>
      <button onclick="downloadFile()">Dᴏᴡɴʟᴏᴀᴅ</button>
      <button onclick="openVLC()">Vᴄʟ ᴘʟᴀʏᴇʀ</button>
      <button onclick="openMX()">Mx ᴘʟᴀʏᴇʀ</button>
    </div>
  </div>

</div>

<script>

/* Intro */
window.addEventListener("load",()=>{
  setTimeout(()=>{document.getElementById("intro").classList.add("fade-out");},3800);
});

/* BACKGROUND ANIMATION */

const canvas=document.getElementById("bg");
const ctx=canvas.getContext("2d");
let W,H;

function resize(){
  W=canvas.width=window.innerWidth;
  H=canvas.height=window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

let stars=[];
for(let i=0;i<250;i++){
  stars.push({
    x:Math.random()*W,
    y:Math.random()*H,
    z:Math.random()*1.5+0.5
  });
}

function renderBG(){
  requestAnimationFrame(renderBG);

  ctx.clearRect(0,0,W,H);

  const isLight=document.body.classList.contains("light-mode");

  stars.forEach(s=>{
    ctx.fillStyle=isLight
      ? "rgba(0,0,0,"+(0.15*s.z)+")"
      : "rgba(255,255,255,"+(0.3*s.z)+")";

    ctx.fillRect(s.x,s.y,2*s.z,2*s.z);

    s.y+=0.08*s.z;
    if(s.y>H){
      s.y=0;
      s.x=Math.random()*W;
    }
  });
}

renderBG();

/* Theme */
const themeIcon=document.getElementById("themeIcon");
themeIcon.onclick=()=>{
  document.body.classList.toggle("light-mode");
  themeIcon.textContent=document.body.classList.contains("light-mode")?"☀":"✧";
};

/* Mini + Drag */
const player=document.getElementById("player");
let isMini=false;

function toggleMini(){
  isMini=!isMini;
  if(isMini){
    player.classList.add("mini");
  }else{
    player.classList.remove("mini");
    player.style.left="";
    player.style.top="";
  }
}

let dragging=false, offsetX=0, offsetY=0;

player.addEventListener("mousedown",e=>{
  if(!isMini) return;
  dragging=true;
  offsetX=e.clientX-player.offsetLeft;
  offsetY=e.clientY-player.offsetTop;
});
document.addEventListener("mousemove",e=>{
  if(!dragging) return;
  player.style.left=(e.clientX-offsetX)+"px";
  player.style.top=(e.clientY-offsetY)+"px";
});
document.addEventListener("mouseup",()=>dragging=false);

player.addEventListener("touchstart",e=>{
  if(!isMini) return;
  dragging=true;
  const t=e.touches[0];
  offsetX=t.clientX-player.offsetLeft;
  offsetY=t.clientY-player.offsetTop;
});
document.addEventListener("touchmove",e=>{
  if(!dragging) return;
  const t=e.touches[0];
  player.style.left=(t.clientX-offsetX)+"px";
  player.style.top=(t.clientY-offsetY)+"px";
});
document.addEventListener("touchend",()=>dragging=false);

/* Fullscreen */
function goFullscreen(){
  const video=document.querySelector("video");
  if(video.requestFullscreen) video.requestFullscreen();
}

/* Button Functions */
const fileUrl="{{ file_url }}";
const fileName="{{ file_name }}";

function copyLink(){
  const link=window.location.href;
  navigator.clipboard.writeText(link).then(()=>{
    alert("Link copied!");
  }).catch(err=>console.error(err));
}

function downloadFile(){
  const a=document.createElement("a");
  a.href=fileUrl;
  a.download=fileName;
  a.click();
}

function openVLC(){
  window.location.href="vlc://"+encodeURIComponent(fileUrl);
}

function openMX(){
  window.location.href="intent:"+fileUrl+"#Intent;action=android.intent.action.VIEW;type=video/*;end";
}

</script>

</body>
</html>
