<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{{ file_name }}</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --accent: #e50914;
            --tg-color-scheme: light;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #000;
            color: white;
            overflow-x: hidden;
        }

        .container {
            max-width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .player-container {
            flex: 1;
            width: 100%;
            overflow: hidden;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        .controls-panel {
            background: rgba(255,255,255,.05);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,.15);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 40vh;
            overflow-y: auto;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .btn {
            padding: 10px 12px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            background: rgba(255,255,255,.1);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn:hover {
            background: rgba(229,9,20,.25);
            box-shadow: 0 0 15px rgba(229,9,20,.5);
            transform: translateY(-2px);
        }

        .btn-download {
            grid-column: span 2;
            background: rgba(229,9,20,.2);
        }

        .info-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(255,255,255,.15);
            font-size: 12px;
            opacity: 0.8;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            word-break: break-word;
        }

        .status-message {
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            text-align: center;
        }

        .status-success {
            background: rgba(76,175,80,.2);
            color: #4caf50;
        }

        .status-error {
            background: rgba(244,67,54,.2);
            color: #f44336;
        }

        .hidden {
            display: none !important;
        }

        .control-label {
            font-weight: 600;
            font-size: 12px;
            margin-bottom: 4px;
        }

        select {
            padding: 8px;
            border: 1px solid rgba(255,255,255,.15);
            border-radius: 6px;
            background-color: rgba(255,255,255,.05);
            color: white;
            font-size: 12px;
            cursor: pointer;
        }

        select:focus {
            outline: none;
            border-color: var(--accent);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="player-container">
            <video id="videoPlayer" playsinline controls>
                <source src="{{ stream_url }}" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>

        <div class="controls-panel">
            <div id="statusMessage" class="status-message hidden"></div>

            <div class="button-group">
                <button class="btn" id="shareBtn" onclick="shareVideo()">Share</button>
                <button class="btn" id="fullscreenBtn" onclick="toggleFullscreen()">Fullscreen</button>
                <a id="downloadBtn" class="btn btn-download" href="{{ download_url }}" download="{{ file_name }}">Download</a>
            </div>

            <div class="info-section">
                <div class="info-item">
                    <span>File:</span>
                    <span>{{ file_name }}</span>
                </div>
                <div class="info-item">
                    <span>Size:</span>
                    <span>{{ file_size }}</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialize Telegram WebApp
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        let player = null;

        function shareVideo() {
            const link = window.location.href;
            if (navigator.share) {
                navigator.share({
                    title: '{{ file_name }}',
                    text: 'Watch: {{ file_name }}',
                    url: link
                }).catch(err => console.log('Share error:', err));
            } else {
                navigator.clipboard.writeText(link).then(() => {
                    showStatus('Link copied!', 'success');
                }).catch(err => showStatus('Failed to copy', 'error'));
            }
        }

        function toggleFullscreen() {
            const video = document.getElementById('videoPlayer');
            if (video.requestFullscreen) {
                video.requestFullscreen();
            }
        }

        function showStatus(message, type = 'info') {
            const element = document.getElementById('statusMessage');
            element.textContent = message;
            element.className = `status-message status-${type}`;
            element.classList.remove('hidden');
            setTimeout(() => hideStatus(), 3000);
        }

        function hideStatus() {
            document.getElementById('statusMessage').classList.add('hidden');
        }

        // Handle Telegram Close Button
        if (tg) {
            tg.onEvent('closeClicked', function() {
                tg.close();
            });
        }
    </script>
</body>
</html>
